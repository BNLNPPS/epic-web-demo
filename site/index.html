<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ePIC DevCloud Demos</title>
    <style>
        :root { --fg: #333; --bg: #fff; --muted: #666; --link: #2563eb; }
        @media (prefers-color-scheme: dark) {
            :root { --fg: #ddd; --bg: #121417; --muted: #9aa3ad; --link: #7aa2f7; }
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               max-width: 600px; margin: 80px auto; padding: 0 20px;
               color: var(--fg); background: var(--bg); }
        h1 { font-size: 1.8em; margin-bottom: 0.3em; }
        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .subtitle { color: var(--muted); margin-bottom: 2em; }
        .links { list-style: none; padding: 0; }
        .links li { margin: 1em 0; font-size: 1.1em; }
        .links .desc { color: var(--muted); font-size: 0.9em; display: block; margin-top: 0.2em; }
    </style>
</head>
<body>
    <h1>ePIC DevCloud Demos</h1>
    <p class="subtitle">Demonstrators for ePIC services and tooling</p>
    <ul class="links">
        <li>
            <a href="/demo/documents/">ePIC Documents</a>
            <span class="desc">Document list generated automatically from the ePIC community on Zenodo</span>
            <span class="desc"><a href="/demo/documents/maintenance.html">Nightly maintenance report</a> — AI assessment over the curation checks and the overnight changes</span>
        </li>
    </ul>
</body>
</html>
